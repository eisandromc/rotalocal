<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="RotaLocal conecta turistas a experiências autênticas oferecidas por guias locais credenciados.">
  <title>RotaLocal — Experiências com guias credenciados</title>
  <link rel="preconnect" href="https://images.unsplash.com">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>
<body>
  <a class="skip-link" href="#main-content">Pular para o conteúdo</a>

  <header class="site-header" id="site-header">
    <div class="container header-inner">
      <button class="brand-button" type="button" data-nav="explore" aria-label="Ir para Explorar">
        <span class="brand-mark" aria-hidden="true">R</span>
        <span class="brand-copy">
          <strong>RotaLocal</strong>
          <small>experiências autênticas</small>
        </span>
      </button>

      <button class="menu-toggle" id="menu-toggle" type="button" aria-expanded="false" aria-controls="main-nav">
        <span class="sr-only">Abrir menu</span>
        <span aria-hidden="true">☰</span>
      </button>

      <nav class="main-nav" id="main-nav" aria-label="Navegação principal">
        <button type="button" class="nav-link is-active" data-nav="explore">Explorar</button>
        <button type="button" class="nav-link" data-action="open-reservations">Minhas Reservas</button>
        <button type="button" class="nav-link" data-action="guide-info">Para Guias</button>
        <button type="button" class="button button-small button-outline" data-nav="guide">Área do Guia</button>
      </nav>
    </div>
  </header>

  <main id="main-content" tabindex="-1"></main>

  <div id="comparison-bar" class="comparison-bar" aria-live="polite"></div>
  <div id="toast-region" class="toast-region" aria-live="polite" aria-atomic="true"></div>
  <div id="modal-root"></div>

  <footer class="site-footer">
    <div class="container footer-inner">
      <div>
        <strong>RotaLocal</strong>
        <p>Descubra o destino com quem conhece cada história de perto.</p>
      </div>
      <div class="footer-badges" aria-label="Compromissos da plataforma">
        <span>Guias verificados</span>
        <span>Reserva transparente</span>
        <span>Experiências locais</span>
      </div>
    </div>
  </footer>
</body>
</html>
